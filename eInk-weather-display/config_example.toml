# Edit this example file to suit your needs and save it as config.toml
# All options are documented in CONFIGURATION.md in the repository root

# If True, save to a png file
# If False, display on EPD
dev_mode = true
dev_mode_output_filename = "image.png"

# Control the usage of random data
dev_mode_random_weather_data = true
dev_mode_random_sensor_data = true

# A city or neighborhood
fmi_location = "Helsinki"
fmi_observation_location_override = "Espoo"

# Optional override position if API is down
override_name = "Helsinki"
override_latitude = 60.1699
override_longitude = 24.9384

# For debugging, draws borders around each panel
draw_panel_borders = false

# Subtle dividers to improve readability
draw_borders = true

# Increase in case of bad reception, seconds
sensor_poll_timeout = 10

# Allows rotating the display by 180 degrees
rotate_180 = true

# Mirrors the image horizontally (for 10.3" model)
mirror_horizontal = true

# Currently the only supported models: '7.8', '10.3'
epd_model = "10.3"

# The VCOM voltage of the display in millivolts, printed on its FPC cable (e.g. -1.37V -> 1370)
epd_voltage = 1370

# 4, 2 or 1 bits per pixel
bits_per_pixel = 4

# Seconds between full refreshes: INIT and redraw of the whole panel to clear ghosting (must divide 3600 evenly)
full_refresh_interval = 3600

# Seconds between updates, which redraw only the changed areas (must divide 3600 evenly)
update_interval = 60

# Show a warning icon if the temperature is >= this value
high_temperature_warning_threshold = 25

# Show an extreme warning icon if the temperature is >= this value
extreme_high_temperature_warning_threshold = 30

# Show a warning icon if the temperature is <= this value
low_temperature_warning_threshold = -20

# Show an extreme warning icon if the temperature is <= this value
extreme_low_temperature_warning_threshold = -30

# Show a warning icon if the temperature is >= this value between 22.00 and 08.00
tropical_night_temperature_warning_threshold = 20

# Optional Home Assistant connection for reading sensor data.
# Create a long-lived access token in Home Assistant under your user profile.
# The token is sent with every request, so prefer an https:// URL where available.
# [home_assistant]
# url = "http://homeassistant.local:8123"
# bearer_token = "YOUR_LONG_LIVED_ACCESS_TOKEN"

# Sensors to show. Repeat the [[sensors]] table for each sensor.
# Home Assistant sensors refer to entity ids. battery_sensor_id is optional.
# [[sensors]]
# type = "HomeAssistant"
# name = "Living room"
# temperature_sensor_id = "sensor.living_room_temperature"
# humidity_sensor_id = "sensor.living_room_humidity"
# battery_sensor_id = "sensor.living_room_battery"
#
# [[sensors]]
# type = "Ruuvi"
# name = "Balcony"
# mac = "AA:BB:CC:DD:EE:FF"
