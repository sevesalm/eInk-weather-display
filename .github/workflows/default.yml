name: eInk-weather-display

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and dependencies
        # Python comes from .python-version. --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv sync --locked
      - name: Check the code compiles
        run: uv run python -m compileall -q .
      - name: Lint with ruff
        run: uv run ruff check
      - name: Type check with ty
        run: uv run ty check
      - name: Run tests
        run: uv run python -m unittest discover -s eInk-weather-display
